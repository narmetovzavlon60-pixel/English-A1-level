function cefrRank(pct){
  if(pct >= 95) return { cls:'excellent', label:'A1 · Excellent' };
  if(pct >= 80) return { cls:'good',      label:'A1 · Good' };
  if(pct >= 60) return { cls:'fair',      label:'A1 · Fair' };
  return { cls:'retry', label:'A1 · Retry' };
}

function renderResult(){
  const fill = $('#plFill');
  if(fill) fill.style.width = '100%';
  $('#plFooter').classList.add('hidden');
  $('#plFooter').style.display = 'none';
  updateDots();

  const total = P.ex.length;
  const pct = total ? Math.round(P.correct / total * 100) : 0;
  const perfect = P.wrong === 0 && total > 0;

  let gemsEarned = 0;
  let bonusXP = 0;
  let newWords = 0;
  let placementUnlocked = 0;

  if(P.isPlacement){
    S.placementDone = true;
    P.placementMarks = P.placementMarks || [];
    let level = 0;
    for(let i = 0; i < P.placementMarks.length; i++){
      if(P.placementMarks[i]) level++;
      else break;
    }
    S.placementLevel = Math.max(0, Math.min(8, level));
    placementUnlocked = S.placementLevel;
    gemsEarned = P.correct * 3;
    bonusXP = P.correct * 8;
  }
  else if(P.isPractice){
    gemsEarned = Math.max(1, Math.round(P.correct / 2));
    bonusXP = 5;
  }
  else {
    const key = P.moduleId + '_' + P.lessonIdx;
    const first = !S.completed[key];
    S.completed[key] = true;
    if(first){
      S.lessonsDone++;
      gemsEarned = perfect ? 20 : 12;
      bonusXP = perfect ? 30 : 20;
    } else {
      gemsEarned = 5;
      bonusXP = 8;
    }
    if(perfect) S.perfectLessons++;
    const m = MODULES.find(mm => mm.id === P.moduleId);
    if(m && m.lessons.every((_, j) => S.completed[m.id + '_' + j])){
      if(!S.completedAt[P.moduleId]) S.completedAt[P.moduleId] = Date.now();
    }
  }

  S.gems += gemsEarned;
  const gainedXP = awardXP(bonusXP);

  (P.wordsToLearn || []).forEach(w => {
    const before = S.words[w.en];
    SRS.add(w.en, 1);
    if(!before) newWords++;
  });

  checkStreak();
  save(true);
  updateTop();
  const gotAch = checkAchievements();

  if(perfect || pct >= 80) confetti();

  SFX.success();
  haptic('success');

  const rank = cefrRank(pct);
  let title = 'Урок пройден!', sub = 'Отличная работа, продолжайте!';
  if(P.isPlacement){
    title = 'Тест завершён';
    sub = placementUnlocked > 0
      ? 'Открыто модулей: ' + placementUnlocked + ' · можно начинать!'
      : 'Начните с первого модуля — впереди много интересного!';
  } else if(pct === 100){
    title = 'Идеально!';
    sub = 'Ни одной ошибки — блестяще!';
  } else if(pct >= 70){
    title = 'Урок пройден!';
    sub = 'Хороший результат!';
  } else {
    title = 'Урок завершён';
    sub = 'Повторите материал и попробуйте снова';
  }

  const failedSet = Array.from(new Set(P.failedWords)).slice(0, 12);
  let failedHtml = '';
  if(failedSet.length > 0){
    failedHtml = `
      <div class="failedBox">
        <b>Повторите слова:</b>
        <div class="failedWords">
          ${failedSet.map(w => `<span class="fw">${w}</span>`).join('')}
        </div>
        <button class="btn ghost" style="margin-top:12px" data-action="practiceFailedWords">${iconRaw('cards')}<span>Тренировать</span></button>
      </div>`;
  }

  // Tutor report
  const avgLen = Math.round(P.recentTimes.length ? (P.recentTimes.reduce((a,b)=>a+b,0) / P.recentTimes.length / 1000) : 0);
  const strengthWords = Object.keys(S.words).filter(en => SRS.strength(en) >= 2).length;
  const tutorHtml = `
    <div class="tutorReport">
      <h4>Отчёт репетитора</h4>
      <div class="tutorRow"><span>Слов в долговременной памяти</span><b>${strengthWords}</b></div>
      <div class="tutorRow"><span>Новых слов в этой сессии</span><b>+${newWords}</b></div>
      <div class="tutorRow"><span>Средний ответ</span><b>${avgLen} сек</b></div>
      <div class="tutorRow"><span>Точность</span><b>${pct}%</b></div>
    </div>
  `;

  const mascotState = pct >= 95 ? 'perfect' : pct >= 80 ? 'good' : pct >= 60 ? 'fair' : 'retry';

  $('#plBody').innerHTML = `
    <div class="resultWrap">
      <div class="mascotWrap">${mascotSVG(mascotState)}</div>
      <div class="resultTitle">${title}</div>
      <div class="cefrRank ${rank.cls}">${rank.label}</div>
      <div class="resultSub">${sub}</div>
      <div class="resStats">
        <div class="resStat"><b style="color:var(--success)">${P.correct}</b><small>Верно</small></div>
        <div class="resStat"><b style="color:var(--danger)">${P.wrong}</b><small>Ошибок</small></div>
        <div class="resStat"><b style="color:var(--accent)">${pct}%</b><small>Точность</small></div>
      </div>
      <div class="resStats">
        <div class="resStat"><b style="color:var(--primary)">+${gainedXP}</b><small>XP</small></div>
        <div class="resStat"><b style="color:var(--accent)">+${gemsEarned}</b><small>💎</small></div>
        <div class="resStat"><b style="color:var(--success)">+${newWords}</b><small>Слов</small></div>
      </div>

      ${failedHtml}

    </div>
  `;

  const footer = $('#plFooter');
  footer.classList.remove('hidden');
  footer.style.display = 'block';
  footer.classList.remove('hasfb');
  footer.innerHTML = `<button class="btn primary" data-action="closePlayer">Продолжить</button>`;
}

function confetti(){
  try{
    if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  }catch(e){}

  const c = document.createElement('canvas');
  c.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:300;';
  document.body.appendChild(c);
  const ctx = c.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const W = Math.floor(window.innerWidth * dpr);
  const H = Math.floor(window.innerHeight * dpr);
  c.width = W; c.height = H;
  c.style.width = window.innerWidth + 'px';
  c.style.height = window.innerHeight + 'px';

  const colors = ['#ff5c5c','#ffb648','#43d17a','#2ea6ff','#a855f7','#22d3ee'];
  const parts = [];
  for(let i = 0; i < 90; i++){
    parts.push({
      x: Math.random() * W,
      y: -Math.random() * H * 0.35,
      vx: (Math.random() - 0.5) * 4 * dpr,
      vy: (2 + Math.random() * 3) * dpr,
      r: (4 + Math.random() * 5) * dpr,
      rot: Math.random() * Math.PI,
      vr: (Math.random() - 0.5) * 0.22,
      c: colors[Math.floor(Math.random() * colors.length)]
    });
  }
  const t0 = performance.now();
  function frame(t){
    const el = t - t0;
    ctx.clearRect(0, 0, W, H);
    parts.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.05 * dpr;
      p.rot += p.vr;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.c;
      ctx.fillRect(-p.r, -p.r / 2, p.r * 2, p.r);
      ctx.restore();
    });
    if(el < 2600) requestAnimationFrame(frame);
    else c.remove();
  }
  requestAnimationFrame(frame);
}

function practiceFailedWords(){
  const words = Array.from(new Set(P.failedWords)).slice(0, 12);
  if(!words.length){ toast('Нет слов для тренировки'); return; }
  const pool = words.map(w => WORD_INDEX[w.toLowerCase()]).filter(Boolean);
  if(!pool.length){ toast('Нет слов'); return; }

  const exs = [];
  const quiz = buildQuiz(shuffle(pool), Math.min(6, pool.length));
  exs.push(...quiz);
  pool.slice(0, 4).forEach(w => exs.push(F(w.en, w.ru, w.coll, w.ipa)));

  closePlayer();
  P.ex = exs.map((e, i) => ({ ex: e, isRetry: false, origIdx: i, isReview: false }));
  P.i = 0; P.correct = 0; P.wrong = 0; P.xp = 0; P.gems = 0;
  P.isPractice = true;
  P.isPlacement = false;
  P.moduleId = null;
  P.lessonIdx = -1;
  P.lessonTitle = 'Тренировка слов';
  P.wordsToLearn = [];
  P.retriesUsed = {};
  P.failedWords = [];
  P.results = new Array(P.ex.length).fill(null);
  P.retryCount = 0;
  P.recentCorrect = 0;
  P.recentTimes = [];
  openPlayer();
}

document.addEventListener('click', function(e){
  const t = e.target.closest('[data-action]');
  if(!t) return;
  const action = t.dataset.action;

  switch(action){
    case 'tab': switchTab(t.dataset.tab); break;
    case 'openModule': openModule(+t.dataset.mi); break;
    case 'forceOpenModule': openModule(+t.dataset.mi); break;
    case 'startLesson': startLesson(+t.dataset.mi, +t.dataset.li); break;
    case 'closeSheet': closeSheet(); break;
    case 'refTab': {
      const kind = t.dataset.kind;
      $$('#content .tab').forEach(x => x.classList.remove('active'));
      t.classList.add('active');
      SFX.tap();
      if(kind === 'grammar') renderGrammar();
      else renderLexicon();
      break;
    }
    case 'toggleG': toggleG(+t.dataset.gi); break;
    case 'setLexFilter': setLexFilter(t.dataset.cat); break;
    case 'startReview': startReview(); break;
    case 'openCategoryPicker': openCategoryPicker(t.dataset.mode); break;
    case 'startPractice': startPractice(t.dataset.mode, t.dataset.cat); break;
    case 'buyTheme': buyTheme(t.dataset.key); break;
    case 'buyBoost': buyBoost(t.dataset.id); break;
    case 'toggleSound': toggleSound(); break;
    case 'resetProgress': resetProgress(); break;
    case 'exportProgress': exportProgress(); break;
    case 'importProgress': importProgress(); break;
    case 'savePassportPNG': savePassportPNG(); break;
    case 'quitLesson': quitLesson(); break;
    case 'useHint': useHint(); break;
    case 'mainAction': mainAction(); break;
    case 'pickOpt': pickOpt(+t.dataset.i); break;
    case 'pickTok': pickTok(+t.dataset.i); break;
    case 'pickDlgOpt': pickDlgOpt(+t.dataset.i); break;
    case 'pickWord': pickWord(+t.dataset.i); break;
    case 'unpickWord': unpickWord(+t.dataset.pos); break;
    case 'mClick': mClick(t.dataset.side, +t.dataset.i); break;
    case 'flipCard': flipCard(); break;
    case 'flashAnswer': flashAnswer(t.dataset.known === '1'); break;
    case 'closePlayer': closePlayer(); break;
    case 'practiceFailedWords': practiceFailedWords(); break;
    case 'hmcTap': hmcTap(t.dataset.k, +t.dataset.v); break;
    case 'dotTap': break;
  }
});
