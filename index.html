<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#17212b">
<title>A1 English Master</title>
<link rel="manifest" href='data:application/manifest+json,{"name":"A1 English Master","short_name":"A1 Master","start_url":".","display":"standalone","background_color":"%2317212b","theme_color":"%2317212b","icons":[{"src":"data:image/svg%2Bxml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 192 192%27%3E%3Crect width=%27192%27 height=%27192%27 rx=%2740%27 fill=%27%232ea6ff%27/%3E%3Ctext x=%2796%27 y=%27128%27 font-size=%27100%27 text-anchor=%27middle%27 fill=%27white%27 font-family=%27sans-serif%27 font-weight=%27900%27%3EA1%3C/text%3E%3C/svg%3E","sizes":"192x192","type":"image/svg+xml"}]}'>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
/* ============ CORE / THEME VARS ============ */
:root{
  --bg:#17212b; --bg2:#1c2733; --card:#212e3a; --card2:#2a3846;
  --text:#ffffff; --muted:#8595a5;
  --primary:#2ea6ff; --primary2:#0d8ee0;
  --accent:#ffb648; --success:#43d17a; --danger:#ff5c5c;
  --border:rgba(255,255,255,.07);
  --radius:18px;
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --shadow-soft:0 24px 60px rgba(0,0,0,.35);
  --serif:'Charter','Iowan Old Style','Palatino Linotype',Georgia,'Times New Roman',serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;overflow:hidden;}
body{
  font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  font-feature-settings:"tnum" 1,"cv11" 1;
  background:var(--bg);color:var(--text);
  user-select:none;-webkit-user-select:none;
  transition:background .35s ease,color .35s ease;
  overscroll-behavior:none;
}
button{font-family:inherit;border:none;background:none;color:inherit;cursor:pointer;}
input{font-family:inherit;}
.hidden{display:none !important;}
::-webkit-scrollbar{width:0;height:0;}
svg{display:block;}

/* ============ APP SHELL ============ */
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:640px;margin:0 auto;position:relative;}
#topbar{
  display:flex;align-items:center;gap:10px;
  padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;
  background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;
}
.stat{display:flex;align-items:center;gap:5px;background:var(--card);padding:7px 11px;border-radius:12px;font-size:14px;font-weight:700;min-height:34px;}
.stat .ic{width:16px;height:16px;color:var(--muted);}
.stat.flame .ic{color:#ff8c42;}
.stat.gem .ic{color:var(--primary);}
.stat.heart .ic{color:var(--danger);}
.lvlwrap{flex:1;min-width:0;}
.lvlrow{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-weight:700;margin-bottom:4px;}
.xpbar{height:8px;background:var(--card);border-radius:99px;overflow:hidden;}
#stXpFill{height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg,var(--primary),var(--accent));transition:width .5s cubic-bezier(.2,.8,.2,1);}

#content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px 96px;}
#content.fadeup{animation:fadeUp .3s cubic-bezier(.2,.8,.2,1);}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

#nav{
  position:absolute;bottom:0;left:0;right:0;
  display:flex;justify-content:space-around;align-items:center;
  background:var(--bg2);border-top:1px solid var(--border);
  padding:6px 4px calc(env(safe-area-inset-bottom) + 6px);z-index:40;
}
.navbtn{flex:1;min-height:56px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:6px 2px;border-radius:14px;color:var(--muted);transition:transform .15s,color .2s,background .2s;}
.navbtn svg{width:22px;height:22px;transition:transform .2s;}
.navbtn small{font-size:9.5px;font-weight:800;letter-spacing:.2px;}
.navbtn.active{color:var(--primary);background:color-mix(in srgb,var(--primary) 12%,transparent);}
.navbtn.active svg{transform:translateY(-1px) scale(1.08);}
.navbtn:active{transform:scale(.94);}

/* ============ COMMON UI ============ */
.seclabel{font-size:11.5px;font-weight:800;letter-spacing:.9px;text-transform:uppercase;color:var(--muted);margin:20px 4px 10px;}
.card{background:var(--card);border-radius:var(--radius);padding:16px;border:1px solid var(--border);box-shadow:var(--shadow);}
.btn{
  position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:8px;
  width:100%;min-height:52px;padding:15px;border-radius:16px;font-size:15.5px;font-weight:800;letter-spacing:.2px;
  background:var(--card2);color:var(--text);transition:transform .12s ease,filter .2s,opacity .2s;
}
.btn svg{width:18px;height:18px;}
.btn:active{transform:scale(.97);}
.btn.primary{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;box-shadow:0 8px 22px -8px var(--primary);}
.btn.accent{background:linear-gradient(135deg,var(--accent),#ff8c00);color:#241a00;}
.btn.ghost{background:transparent;border:1.5px solid var(--border);color:var(--text);}
.btn.ghost:hover{border-color:color-mix(in srgb,var(--text) 18%,transparent);}
.btn.ok{background:linear-gradient(135deg,var(--success),#2ea35c);color:#04220f;}
.btn[disabled]{opacity:.45;pointer-events:none;}

/* ============ LESSONS TAB ============ */
.hero{
  background:linear-gradient(135deg,var(--primary),var(--primary2));
  border-radius:22px;padding:20px;color:#fff;position:relative;overflow:hidden;
  box-shadow:0 16px 40px -16px var(--primary);
}
.hero::after{content:'';position:absolute;right:-30px;top:-40px;width:150px;height:150px;background:rgba(255,255,255,.12);border-radius:50%;}
.hero::before{content:'';position:absolute;right:30px;bottom:-60px;width:100px;height:100px;background:rgba(255,255,255,.08);border-radius:50%;}
.hero-title{font-size:24px;font-weight:900;letter-spacing:-.4px;position:relative;font-optical-sizing:auto;}
.hero-sub{font-size:13px;opacity:.9;margin-top:3px;font-weight:600;position:relative;}
.hero-stats{display:flex;gap:8px;margin-top:14px;position:relative;flex-wrap:wrap;}
.hero-pill{background:rgba(255,255,255,.18);border-radius:12px;padding:7px 11px;font-size:12px;font-weight:800;backdrop-filter:blur(4px);display:flex;align-items:center;gap:5px;}
.hero-pill svg{width:14px;height:14px;}
.goalRow{position:relative;margin-top:14px;}
.goalLabel{display:flex;justify-content:space-between;font-size:11.5px;font-weight:800;opacity:.95;margin-bottom:6px;}
.goalBar{height:9px;background:rgba(255,255,255,.22);border-radius:99px;overflow:hidden;}
.goalBar i{display:block;height:100%;border-radius:99px;background:#fff;box-shadow:0 0 12px rgba(255,255,255,.55);transition:width .6s cubic-bezier(.2,.8,.2,1);}

.reviewHero{
  display:flex;align-items:center;gap:12px;margin-bottom:12px;
  background:linear-gradient(135deg,color-mix(in srgb,var(--primary) 18%,transparent),color-mix(in srgb,var(--accent) 14%,transparent));
  border:1px solid color-mix(in srgb,var(--primary) 35%,transparent);
  border-radius:18px;padding:14px;transition:transform .12s;
}
.reviewHero:active{transform:scale(.98);}
.reviewHero .ri{width:28px;height:28px;flex-shrink:0;color:var(--primary);}
.reviewHero .rt{flex:1;}
.reviewHero .rt b{font-size:14.5px;display:block;}
.reviewHero .rt small{font-size:11.5px;color:var(--muted);font-weight:700;}
.reviewHero .rb{
  background:var(--danger);color:#fff;font-size:13px;font-weight:900;
  padding:8px 12px;border-radius:12px;flex-shrink:0;
  box-shadow:0 4px 12px -4px var(--danger);
}

.modcard{
  display:flex;align-items:center;gap:13px;
  background:var(--card);border-radius:var(--radius);
  padding:14px;margin-bottom:10px;border:1px solid var(--border);
  transition:transform .12s ease,background .2s;
  position:relative;overflow:hidden;
}
.modcard:active{transform:scale(.985);}
.modcard.complete{border-color:color-mix(in srgb,var(--success) 45%,transparent);}
.modcard.locked{opacity:.6;}
.modicon{width:48px;height:48px;flex-shrink:0;border-radius:15px;display:flex;align-items:center;justify-content:center;background:var(--card2);}
.modicon svg{width:24px;height:24px;color:var(--primary);}
.modinfo{flex:1;min-width:0;}
.modtitle{font-size:15px;font-weight:800;margin-bottom:3px;letter-spacing:-.01em;}
.modsub{font-size:11.5px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.modprog{margin-top:7px;height:6px;background:var(--card2);border-radius:99px;overflow:hidden;}
.modprog i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--success),#2ea35c);transition:width .5s;}
.modcount{font-size:11px;font-weight:800;color:var(--muted);background:var(--card2);padding:5px 9px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;gap:4px;}
.modcount.done{background:color-mix(in srgb,var(--success) 18%,transparent);color:var(--success);}
.modcount svg{width:12px;height:12px;}
.modstamp{
  position:absolute;top:8px;right:8px;width:38px;height:38px;pointer-events:none;
  display:flex;align-items:center;justify-content:center;
  filter:drop-shadow(0 2px 4px rgba(0,0,0,.35));
}
.modstamp svg{width:100%;height:100%;}
.modstamp .stampdate{position:absolute;bottom:-2px;left:0;right:0;font-size:7px;font-weight:900;text-align:center;}

/* ============ SHEET ============ */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:80;display:flex;align-items:flex-end;backdrop-filter:blur(2px);}
.sheetInner{
  background:var(--bg2);width:100%;max-width:640px;margin:0 auto;
  border-radius:26px 26px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom) + 22px);
  max-height:82vh;overflow-y:auto;animation:slideUp .28s cubic-bezier(.2,.9,.3,1);
  border-top:1px solid var(--border);
}
@keyframes slideUp{from{transform:translateY(100%);}to{transform:translateY(0);}}
.sheetHandle{width:42px;height:5px;border-radius:99px;background:var(--card2);margin:0 auto 16px;}
.sheetTitle{font-size:19px;font-weight:900;margin-bottom:4px;letter-spacing:-.01em;}
.sheetSub{font-size:12.5px;color:var(--muted);margin-bottom:16px;font-weight:600;}
.lessonrow{
  display:flex;align-items:center;gap:12px;padding:13px;
  background:var(--card);border-radius:15px;margin-bottom:9px;
  border:1px solid var(--border);transition:transform .12s;min-height:64px;
}
.lessonrow:active{transform:scale(.98);}
.lessonrow.done{border-color:color-mix(in srgb,var(--success) 40%,transparent);}
.lnum{width:34px;height:34px;border-radius:11px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;background:var(--card2);}
.lnum svg{width:16px;height:16px;}
.lessonrow.done .lnum{background:var(--success);color:#04220f;}
.ltext{flex:1;font-size:14px;font-weight:700;}
.lsub{font-size:11px;color:var(--muted);font-weight:600;margin-top:2px;}

/* ============ PLAYER OVERLAY ============ */
.overlay{
  position:fixed;inset:0;z-index:90;background:var(--bg);
  display:flex;flex-direction:column;max-width:640px;margin:0 auto;
  animation:fadeIn .2s ease;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.plTop{
  display:flex;flex-direction:column;gap:8px;
  padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;flex-shrink:0;
}
.plTopRow{display:flex;align-items:center;gap:11px;}
.iconbtn{
  width:44px;height:44px;border-radius:12px;background:var(--card);
  display:flex;align-items:center;justify-content:center;
  transition:transform .12s;flex-shrink:0;
}
.iconbtn svg{width:18px;height:18px;}
.iconbtn:active{transform:scale(.92);}
.iconbtn.on{background:var(--accent);color:#241a00;}
.plHearts{display:flex;gap:2px;align-items:center;flex-shrink:0;}
.plHearts svg{width:16px;height:16px;color:var(--danger);}
.plHearts svg.empty{color:var(--card2);}

.plDots{display:flex;gap:4px;justify-content:center;align-items:center;flex-wrap:wrap;padding:2px 0;}
.pdot{width:8px;height:8px;border-radius:50%;background:var(--card2);transition:transform .25s,background .25s;}
.pdot.done{background:var(--success);}
.pdot.err{background:var(--danger);}
.pdot.retry{background:var(--accent);}
.pdot.cur{background:var(--primary);transform:scale(1.4);animation:pulse 1.4s infinite;}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--primary) 50%,transparent);}50%{box-shadow:0 0 0 5px transparent;}}
.plProgress{height:6px;background:var(--card);border-radius:99px;overflow:hidden;}
#plFill{height:100%;width:0%;border-radius:99px;background:linear-gradient(90deg,var(--success),#7cf0a8);transition:width .4s cubic-bezier(.2,.8,.2,1);}

.plBody{flex:1;overflow-y:auto;padding:8px 18px 20px;display:flex;flex-direction:column;}
.plFooter{padding:12px 18px calc(env(safe-area-inset-bottom) + 16px);flex-shrink:0;background:var(--bg);border-top:1px solid transparent;transition:border-color .2s;}
.plFooter.hasfb{border-top-color:var(--border);}

.exWrap{transition:opacity .18s ease,transform .18s ease;}
.exWrap.fade{opacity:0;transform:translateY(-6px);}

.exHead{font-size:11.5px;font-weight:800;color:var(--muted);letter-spacing:.8px;text-transform:uppercase;margin:14px 0 12px;}
.exQ{font-size:21px;font-weight:800;line-height:1.35;margin-bottom:20px;letter-spacing:-.2px;}
.exHint{font-size:13px;color:var(--muted);margin-bottom:14px;font-weight:600;}

.opts{display:flex;flex-direction:column;gap:10px;}
.opt{
  position:relative;overflow:hidden;padding:16px;border-radius:15px;background:var(--card);
  border:2px solid var(--border);font-size:16px;font-weight:700;text-align:left;
  transition:transform .12s,border-color .2s,background .2s;min-height:56px;
}
.opt:active{transform:scale(.98);}
.opt.correct{border-color:var(--success);background:color-mix(in srgb,var(--success) 16%,transparent);color:var(--success);}
.opt.wrong{border-color:var(--danger);background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger);text-decoration:underline wavy var(--danger);text-underline-offset:3px;}
.opt.disabled{pointer-events:none;}
.opt.focus-right{outline:2px solid var(--success);outline-offset:2px;}

.buildArea{
  min-height:70px;border-bottom:2px solid var(--border);
  display:flex;flex-wrap:wrap;gap:8px;padding:10px 2px;margin-bottom:22px;
  align-content:flex-start;
}
.bank{display:flex;flex-wrap:wrap;gap:8px;}
.chip{
  padding:11px 15px;border-radius:13px;background:var(--card);
  border:1px solid var(--border);font-size:15px;font-weight:700;min-height:44px;
  transition:transform .1s,background .2s;box-shadow:0 3px 0 rgba(0,0,0,.18);
}
.chip:active{transform:scale(.95);}

.tokens{display:flex;flex-wrap:wrap;gap:9px;}
.tok{
  padding:13px 15px;border-radius:13px;background:var(--card);
  border:2px solid var(--border);font-size:16px;font-weight:700;min-height:48px;
  transition:transform .12s,border-color .2s;
}
.tok:active{transform:scale(.96);}
.tok.correct{border-color:var(--success);background:color-mix(in srgb,var(--success) 18%,transparent);color:var(--success);}
.tok.wrong{border-color:var(--danger);background:color-mix(in srgb,var(--danger) 18%,transparent);color:var(--danger);}
.tok.disabled{pointer-events:none;}

.matchWrap{display:flex;gap:10px;}
.mcol{flex:1;display:flex;flex-direction:column;gap:9px;}
.mchip{
  padding:13px 10px;border-radius:14px;background:var(--card);
  border:2px solid var(--border);font-size:14px;font-weight:700;min-height:56px;
  transition:transform .12s,border-color .2s,background .2s;
  display:flex;align-items:center;justify-content:center;
  text-align:center;word-break:break-word;
}
.mchip:active{transform:scale(.97);}
.mchip.sel{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 15%,transparent);}
.mchip.done{border-color:var(--success);background:color-mix(in srgb,var(--success) 15%,transparent);color:var(--success);pointer-events:none;}
.mchip.err{border-color:var(--danger);background:color-mix(in srgb,var(--danger) 15%,transparent);}

.typeIn{
  width:100%;padding:16px;border-radius:15px;background:var(--card);
  border:2px solid var(--border);color:var(--text);
  font-size:17px;font-weight:700;outline:none;min-height:56px;
  transition:border-color .2s,background .2s;
}
.typeIn::placeholder{color:var(--muted);font-weight:600;}
.typeIn:focus{border-color:var(--primary);}
.typeIn.correct{border-color:var(--success);background:color-mix(in srgb,var(--success) 16%,transparent);color:var(--success);}
.typeIn.wrong{border-color:var(--danger);background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger);}
.diffHint{font-size:13px;font-weight:700;color:var(--accent);margin-top:8px;text-align:center;}

.flashwrap{perspective:1100px;margin:24px 0 26px;}
.flashcard{
  width:100%;height:220px;position:relative;
  transform-style:preserve-3d;transition:transform .55s cubic-bezier(.2,.8,.2,1);
}
.flashcard.flipped{transform:rotateY(180deg);}
.fcFace{
  position:absolute;inset:0;backface-visibility:hidden;
  border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:22px;text-align:center;font-weight:900;font-size:26px;line-height:1.25;
  border:1px solid var(--border);box-shadow:var(--shadow);
}
.fcFront{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;}
.fcBack{background:var(--card);color:var(--text);transform:rotateY(180deg);font-size:23px;}
.fcColl{font-size:12px;font-weight:700;color:var(--muted);margin-top:12px;font-style:italic;opacity:.9;}
.fcIpa{font-size:14px;font-weight:600;color:var(--muted);margin-top:8px;font-family:var(--serif);}
.flashBtns{display:flex;gap:10px;}

/* Dialog */
.dlgChar{
  display:flex;align-items:center;gap:10px;margin-bottom:14px;
  background:var(--card);padding:10px 14px;border-radius:16px;border:1px solid var(--border);
}
.dlgAvatar{
  width:42px;height:42px;border-radius:14px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:18px;font-weight:900;background:var(--card2);
  color:var(--text);
}
.dlgAvatar.a{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;}
.dlgAvatar.b{background:linear-gradient(135deg,var(--accent),#ff8c00);color:#241a00;}
.dlgAvatar.c{background:linear-gradient(135deg,var(--success),#2ea35c);color:#04220f;}
.dlgName{font-size:14px;font-weight:800;}
.dlgRole{font-size:11px;color:var(--muted);font-weight:600;margin-top:2px;}
.dlgScene{
  display:inline-block;font-size:11px;font-weight:800;color:var(--primary);
  background:color-mix(in srgb,var(--primary) 14%,transparent);padding:5px 11px;border-radius:10px;
  letter-spacing:.6px;text-transform:uppercase;margin-bottom:16px;
}
.dlgHist{display:flex;flex-direction:column;gap:10px;margin-bottom:20px;}
.dlgLine{display:flex;gap:9px;align-items:flex-start;}
.dlgWho{
  width:30px;height:30px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:12px;font-weight:900;background:var(--card2);
}
.dlgWho.a{background:var(--primary);color:#fff;}
.dlgWho.b{background:var(--accent);color:#241a00;}
.dlgWho.c{background:var(--success);color:#04220f;}
.dlgTxt{
  background:var(--card);padding:11px 14px;border-radius:14px;
  font-size:14.5px;font-weight:600;line-height:1.45;flex:1;
}
.dlgLine.b .dlgTxt{background:color-mix(in srgb,var(--primary) 14%,transparent);}

/* Feedback */
.feedback{
  display:none;align-items:flex-start;gap:9px;
  padding:13px 15px;border-radius:15px;font-weight:800;font-size:14.5px;
  margin-bottom:10px;animation:fbIn .22s ease;
}
@keyframes fbIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.feedback.show{display:flex;}
.feedback.good{background:color-mix(in srgb,var(--success) 16%,transparent);color:var(--success);}
.feedback.bad{background:color-mix(in srgb,var(--danger) 14%,transparent);color:var(--danger);}
.feedback .fbMain{flex:1;min-width:0;}
.feedback .fbMain .xpLine{display:block;font-size:12px;font-weight:700;opacity:.7;margin-top:2px;}
.feedback .fbWhy{display:block;font-size:12.5px;font-weight:600;opacity:.85;margin-top:4px;line-height:1.4;}
.fbLink{
  margin-left:auto;padding:7px 12px;border-radius:10px;
  background:color-mix(in srgb,var(--primary) 18%,transparent);color:var(--primary);
  font-size:11.5px;font-weight:900;flex-shrink:0;
  border:1px solid color-mix(in srgb,var(--primary) 30%,transparent);transition:transform .12s;
  display:flex;align-items:center;gap:5px;
}
.fbLink svg{width:13px;height:13px;}
.fbLink:active{transform:scale(.94);}

.retryBadge{
  display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:800;color:var(--accent);
  background:color-mix(in srgb,var(--accent) 16%,transparent);padding:4px 9px;border-radius:8px;
  margin-bottom:10px;letter-spacing:.4px;
}
.reviewBadgePill{
  display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:800;color:var(--primary);
  background:color-mix(in srgb,var(--primary) 16%,transparent);padding:4px 9px;border-radius:8px;
  margin-bottom:10px;letter-spacing:.4px;
}

.failedBox{
  background:var(--card);border-radius:16px;padding:14px;margin-bottom:18px;
  border:1px solid var(--border);text-align:left;
}
.failedBox b{color:var(--danger);font-size:12px;letter-spacing:.4px;text-transform:uppercase;}
.failedWords{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;}
.failedWords .fw{
  background:color-mix(in srgb,var(--danger) 12%,transparent);color:var(--danger);

  border:1px solid color-mix(in srgb,var(--danger) 25%,transparent);
}

/* Result screen */
.resultWrap{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;text-align:center;padding:20px 0;}
.resultIcon{font-size:0;margin-bottom:14px;animation:pop .5s cubic-bezier(.2,1.4,.4,1);}
.resultIcon svg{width:88px;height:88px;}
@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
.resultTitle{font-size:26px;font-weight:900;margin-bottom:6px;letter-spacing:-.01em;}
.cefrRank{
  font-size:14px;font-weight:900;letter-spacing:2.5px;
  text-transform:uppercase;margin-bottom:10px;
}
.cefrRank.excellent{color:#ffcc33;text-shadow:0 0 14px rgba(255,204,51,.35);}
.cefrRank.good{color:var(--success);}
.cefrRank.fair{color:var(--primary);}
.cefrRank.retry{color:var(--accent);}
.resultSub{font-size:14px;color:var(--muted);font-weight:600;margin-bottom:24px;}
.resStats{display:flex;gap:10px;width:100%;margin-bottom:14px;}
.resStat{flex:1;background:var(--card);border-radius:16px;padding:14px 8px;border:1px solid var(--border);}
.resStat b{display:block;font-size:20px;font-weight:900;margin-bottom:3px;}
.resStat small{font-size:10.5px;color:var(--muted);font-weight:700;letter-spacing:.4px;text-transform:uppercase;}

.tutorReport{
  width:100%;background:var(--card);border-radius:16px;padding:16px;
  border:1px solid var(--border);text-align:left;margin-bottom:16px;
}
.tutorReport h4{font-size:11.5px;font-weight:900;letter-spacing:.9px;text-transform:uppercase;color:var(--muted);margin:0 0 12px;}
.tutorRow{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700;padding:6px 0;border-bottom:1px solid var(--border);}
.tutorRow:last-child{border-bottom:none;}
.tutorRow b{color:var(--success);font-weight:900;}

/* Mascot */
.mascotWrap{display:flex;justify-content:center;margin-bottom:8px;}
.mascot{width:88px;height:88px;overflow:visible;}
.mascot .m-eye{transition:transform .3s;transform-origin:center;}
.mascot.jump{animation:mJump 1.1s ease-in-out infinite;}
@keyframes mJump{0%,100%{transform:translateY(0)}35%{transform:translateY(-14px) rotate(-6deg)}70%{transform:translateY(-4px)}}
.mascot.tilt{animation:tilt 1.6s ease-in-out infinite;}
@keyframes tilt{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.mascot.droop{animation:mDroop 2s ease-in-out infinite;}
@keyframes mDroop{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(3px) rotate(-8deg)}}

/* ============ REFERENCE ============ */
.tabs{display:flex;gap:8px;margin-bottom:16px;}
.tab{flex:1;padding:12px;border-radius:14px;background:var(--card);font-size:13px;font-weight:800;color:var(--muted);border:1px solid var(--border);transition:transform .12s;min-height:46px;}
.tab:active{transform:scale(.97);}
.tab.active{background:var(--primary);color:#fff;border-color:transparent;}

.gcard{background:var(--card);border-radius:16px;margin-bottom:10px;border:1px solid var(--border);overflow:hidden;}
.ghead{display:flex;align-items:center;gap:11px;padding:15px;font-weight:800;font-size:14.5px;transition:background .2s;min-height:56px;}
.ghead:active{background:var(--card2);}
.gnum{width:28px;height:28px;border-radius:9px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;flex-shrink:0;}
.garrow{margin-left:auto;color:var(--muted);transition:transform .25s;width:16px;height:16px;}
.gcard.open .garrow{transform:rotate(90deg);}
.gbody{max-height:0;overflow:hidden;transition:max-height .32s ease;padding:0 15px;font-family:var(--serif);}

.gbody p{font-size:14.5px;line-height:1.65;margin:10px 0;color:var(--text);opacity:.95;}
.gbody b{color:var(--accent);}

.gtable td,.gtable th{border:1px solid var(--border);padding:8px 10px;text-align:left;}
.gtable th{background:var(--card2);font-weight:800;font-size:11.5px;color:var(--muted);}

.ex{background:var(--bg2);border-left:3px solid var(--success);border-radius:8px;padding:10px 12px;margin:10px 0;font-size:13.5px;font-family:var(--serif);}
.ex i{color:var(--muted);font-style:normal;font-size:12px;display:block;margin-top:3px;}

.searchBox{
  width:100%;padding:13px 15px;border-radius:15px;background:var(--card);

}

.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:10px;margin-bottom:6px;}
.chips::-webkit-scrollbar{display:none;}
.fchip{padding:9px 14px;border-radius:12px;background:var(--card);font-size:12px;font-weight:800;white-space:nowrap;color:var(--muted);border:1px solid var(--border);transition:transform .12s;min-height:40px;}
.fchip:active{transform:scale(.95);}
.fchip.active{background:var(--primary);color:#fff;border-color:transparent;}
.wordrow{
  display:flex;justify-content:space-between;align-items:flex-start;gap:10px;

}
.wordEn{font-size:15px;font-weight:800;}
.wordIpa{font-size:12.5px;color:var(--primary);font-family:var(--serif);margin-top:1px;font-weight:600;}
.wordRu{font-size:12.5px;color:var(--muted);font-weight:600;margin-top:3px;}
.wordColl{font-size:11.5px;color:var(--accent);font-weight:700;font-style:italic;margin-top:4px;opacity:.85;}
.wordEx{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:4px;font-style:italic;}
.wordCat{font-size:10px;font-weight:800;color:var(--primary);background:color-mix(in srgb,var(--primary) 12%,transparent);padding:3px 8px;border-radius:8px;flex-shrink:0;letter-spacing:1px;}
.learned{color:var(--success) !important;background:color-mix(in srgb,var(--success) 14%,transparent) !important;}

.empty{
  text-align:center;color:var(--muted);padding:34px 20px;font-weight:700;font-size:13.5px;line-height:1.55;
}

/* ============ PRACTICE ============ */
.pmode{
  display:flex;align-items:center;gap:14px;padding:16px;

}
.pmode:active{transform:scale(.985);}
.pmicon{width:50px;height:50px;border-radius:16px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--card2);}
.pmicon svg{width:24px;height:24px;color:var(--primary);}
.pmtitle{font-size:15px;font-weight:800;}
.pmsub{font-size:11.5px;color:var(--muted);font-weight:600;margin-top:3px;}
.pmode.smart{background:linear-gradient(135deg,color-mix(in srgb,var(--primary) 14%,transparent),color-mix(in srgb,var(--accent) 10%,transparent));border-color:color-mix(in srgb,var(--primary) 35%,transparent);}
.reviewBadge{background:var(--danger);color:#fff;font-size:11.5px;font-weight:900;padding:5px 10px;border-radius:99px;flex-shrink:0;min-width:28px;text-align:center;box-shadow:0 4px 12px -4px var(--danger);}

/* ============ SHOP ============ */
.themeGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.themeCard{border-radius:16px;padding:12px;border:2px solid var(--border);background:var(--card);transition:transform .12s;position:relative;overflow:hidden;min-height:110px;}
.themeCard:active{transform:scale(.97);}
.themeCard.owned{border-color:color-mix(in srgb,var(--success) 45%,transparent);}
.themeCard.active{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent);}
.themePreview{height:48px;border-radius:11px;display:flex;gap:4px;padding:8px;margin-bottom:10px;}
.tdot{flex:1;border-radius:6px;}
.themeName{font-size:12.5px;font-weight:800;margin-bottom:4px;}
.themePrice{font-size:11px;font-weight:800;color:var(--accent);display:flex;align-items:center;gap:4px;}
.themePrice.free{color:var(--success);}
.boostRow{display:flex;align-items:center;gap:13px;padding:14px;background:var(--card);border-radius:16px;margin-bottom:9px;border:1px solid var(--border);min-height:74px;}
.boostIcon{width:46px;height:46px;border-radius:14px;background:var(--card2);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.boostIcon svg{width:22px;height:22px;color:var(--primary);}
.boostInfo{flex:1;min-width:0;}
.boostName{font-size:14px;font-weight:800;}
.boostDesc{font-size:11px;color:var(--muted);font-weight:600;margin-top:2px;line-height:1.35;}
.buyBtn{padding:9px 14px;border-radius:12px;background:var(--accent);color:#241a00;font-size:12.5px;font-weight:900;flex-shrink:0;transition:transform .12s;min-height:38px;display:flex;align-items:center;gap:5px;}
.buyBtn svg{width:13px;height:13px;}
.buyBtn:active{transform:scale(.94);}

/* ============ PROFILE ============ */
.profileHead{
  display:flex;align-items:center;gap:15px;padding:20px;
  background:linear-gradient(135deg,var(--primary),var(--primary2));
  border-radius:22px;color:#fff;margin-bottom:16px;
  box-shadow:0 16px 40px -16px var(--primary);
}
.avatar{width:66px;height:66px;border-radius:22px;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:32px;flex-shrink:0;}
.pname{font-size:19px;font-weight:900;letter-spacing:-.01em;}
.plevel{font-size:12px;opacity:.9;font-weight:700;margin-top:3px;}
.statsGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:6px;}
.statCard{background:var(--card);border-radius:16px;padding:15px;border:1px solid var(--border);}
.statCard b{display:block;font-size:22px;font-weight:900;margin-bottom:2px;}
.statCard small{font-size:11px;color:var(--muted);font-weight:700;}
.achGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;}
.achCard{background:var(--card);border-radius:15px;padding:12px 8px;text-align:center;border:1px solid var(--border);opacity:.42;transition:opacity .3s,transform .2s;}
.achCard.unlocked{opacity:1;border-color:color-mix(in srgb,var(--accent) 40%,transparent);}
.achCard .ai{font-size:26px;display:block;margin-bottom:6px;}
.achCard .an{font-size:10px;font-weight:800;line-height:1.25;}
.toggleRow{display:flex;align-items:center;justify-content:space-between;padding:14px;background:var(--card);border-radius:15px;margin-bottom:9px;border:1px solid var(--border);min-height:58px;}
.switch{width:48px;height:28px;border-radius:99px;background:var(--card2);position:relative;transition:background .25s;flex-shrink:0;}
.switch.on{background:var(--success);}
.switch i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .25s cubic-bezier(.2,1.3,.4,1);}
.switch.on i{transform:translateX(20px);}

/* Student Passport */
.passport{
  background:linear-gradient(135deg,var(--card),var(--card2));
  border:1px solid var(--border);border-radius:20px;padding:18px;margin-bottom:10px;
  position:relative;overflow:hidden;
}
.passport::after{
  content:'';position:absolute;right:-30px;top:-30px;width:120px;height:120px;
  background:radial-gradient(circle,color-mix(in srgb,var(--accent) 18%,transparent),transparent 70%);
  border-radius:50%;
}
.ppHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;position:relative;}
.ppTitle{font-size:11px;font-weight:900;letter-spacing:2px;text-transform:uppercase;color:var(--muted);}
.ppLevel{font-size:22px;font-weight:900;color:var(--accent);letter-spacing:1px;}
.ppRows{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;position:relative;}
.ppRow b{display:block;font-size:15px;font-weight:900;}
.ppRow small{font-size:10.5px;color:var(--muted);font-weight:700;letter-spacing:.4px;text-transform:uppercase;}
.ppIssuer{margin-top:14px;font-size:10.5px;color:var(--muted);font-weight:700;letter-spacing:.8px;text-transform:uppercase;position:relative;}

/* Heatmap */
.heatmapBox{background:var(--card);border-radius:16px;padding:14px;border:1px solid var(--border);margin-bottom:10px;}
.heatmap{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;gap:3px;}
.hmc{width:100%;aspect-ratio:1;border-radius:3px;background:var(--card2);transition:transform .12s;border:none;}
.hmc:active{transform:scale(1.35);}
.hmc.l0{background:var(--card2);}
.hmc.l1{background:color-mix(in srgb,var(--primary) 28%,transparent);}
.hmc.l2{background:color-mix(in srgb,var(--primary) 52%,transparent);}
.hmc.l3{background:color-mix(in srgb,var(--primary) 78%,transparent);}
.hmc.l4{background:var(--primary);}
.heatMonths{display:flex;justify-content:space-between;margin-top:6px;font-size:9.5px;color:var(--muted);font-weight:700;}
.heatLegend{display:flex;align-items:center;gap:6px;justify-content:flex-end;margin-top:10px;font-size:10.5px;color:var(--muted);font-weight:700;}
.heatLegend i{width:10px;height:10px;border-radius:3px;display:inline-block;}

/* ============ MODAL / TOAST ============ */
.modal{position:fixed;inset:0;z-index:120;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;padding:26px;backdrop-filter:blur(3px);animation:fadeIn .2s;}
.modalBox{background:var(--bg2);border-radius:24px;padding:26px 22px;width:100%;max-width:380px;text-align:center;border:1px solid var(--border);animation:pop .3s cubic-bezier(.2,1.3,.4,1);box-shadow:var(--shadow-soft);}
.modalIcon{width:56px;height:56px;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;color:var(--primary);}
.modalIcon svg{width:56px;height:56px;}
.modalTitle{font-size:20px;font-weight:900;margin-bottom:8px;letter-spacing:-.01em;}
.modalText{font-size:13.5px;color:var(--muted);font-weight:600;line-height:1.55;margin-bottom:20px;}
.modalBtns{display:flex;flex-direction:column;gap:9px;}

#toast{
  position:fixed;left:50%;bottom:104px;transform:translate(-50%,24px);
  background:var(--card2);color:var(--text);padding:12px 20px;border-radius:14px;
  font-size:13.5px;font-weight:800;z-index:200;opacity:0;pointer-events:none;
  transition:opacity .25s,transform .25s;border:1px solid var(--border);
  box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:88vw;text-align:center;
}
#toast.show{opacity:1;transform:translate(-50%,0);}

.ht-tip{
  position:fixed;z-index:300;background:var(--card2);color:var(--text);
  border:1px solid var(--border);border-radius:10px;padding:7px 10px;
  font-size:11.5px;font-weight:700;pointer-events:none;opacity:0;
  transition:opacity .15s;box-shadow:0 8px 20px rgba(0,0,0,.4);
}
.ht-tip.show{opacity:1;}

@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.shake{animation:shake .4s;}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.001ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.001ms !important;
  }
  .mascot,.pdot.cur{animation:none !important;}
}

<div id="app">
  <header id="topbar">
    <div class="stat flame"><span class="ic" id="icFlame"></span><span id="stStreak">0</span></div>
    <div class="stat gem"><span class="ic" id="icGem"></span><span id="stGems">0</span></div>

    <div class="lvlwrap">
      <div class="lvlrow"><span id="stLevel">Ур. 1</span><span id="stXp">0 / 100 XP</span></div>
      <div class="xpbar"><div id="stXpFill"></div></div>
    </div>
  </header>

  <main id="content"></main>

  <nav id="nav"></nav>
</div>

<div id="player" class="overlay hidden"></div>

<div id="toast"></div>
<div class="ht-tip" id="htTip"></div>

<script>
/* =========================================================
   0. TELEGRAM + SERVICE WORKER (no audio API anywhere)
   ========================================================= */
const TG = (window.Telegram && window.Telegram.WebApp) ? window.Telegram.WebApp : null;
try{
  if(TG){ TG.ready(); TG.expand(); if(TG.disableVerticalSwipes) TG.disableVerticalSwipes(); }
}catch(e){}

try{
  if('serviceWorker' in navigator && location.protocol !== 'file:'){
    const swSrc = "self.addEventListener('install',e=>self.skipWaiting());" +
                  "self.addEventListener('activate',e=>e.waitUntil(self.clients.claim()));" +
                  "self.addEventListener('fetch',e=>{if(e.request.method!=='GET')return;" +
                  "e.respondWith(caches.open('a1v4').then(c=>c.match(e.request).then(r=>r||fetch(e.request).then(res=>{try{c.put(e.request,res.clone());}catch(_){}return res;}).catch(()=>c.match(e.request)))));});";
    const blob = new Blob([swSrc], { type:'application/javascript' });
    const url = URL.createObjectURL(blob);
    navigator.serviceWorker.register(url).catch(()=>{});
  }
}catch(e){}

function haptic(style){
  try{
    if(typeof S !== 'undefined' && S.sound === false) return;
    if(!TG || !TG.HapticFeedback) return;
    if(style==='error') TG.HapticFeedback.notificationOccurred('error');
    else if(style==='success') TG.HapticFeedback.notificationOccurred('success');
    else if(style==='medium') TG.HapticFeedback.impactOccurred('medium');
    else TG.HapticFeedback.impactOccurred('light');
  }catch(e){}
}

/* =========================================================
   0.1 ERROR LOGGING (silent)
   ========================================================= */
window.onerror = function(msg, src, line, col, err){
  try{ console.warn('[A1]', msg, src, line, col, err && err.message); }catch(e){}
  return false;
};
window.addEventListener('unhandledrejection', e => {
  try{ console.warn('[A1] unhandled promise', e && e.reason); }catch(_){}
});

/* =========================================================
   1. STATE
   ========================================================= */
const SAVE_KEY = 'a1_english_master_v1';
const SAVE_VERSION = 4;

const SRS_STEPS = [0, 10*60*1000, 8*3600*1000, 24*3600*1000, 3*86400000, 7*86400000, 21*86400000];

const DEFAULT_STATE = {
  hearts: 5, maxHearts: 5, gems: 150, xp: 0,
  streak: 0, lastDay: null, lastHeartTime: Date.now(),
  theme: 'dark', ownedThemes: ['dark'], sound: true,
  boosts: { shield:0, smartReview:0 },
  doubleUntil: 0, hintsUntil: 0,
  completed: {}, completedAt: {},
  words: {}, achievements: [],
  purchases: 0, lessonsDone: 0, perfectLessons: 0,
  totalCorrect: 0, name: 'A1 Learner',
  history: {}, dailyGoal: 50, placementDone: false, placementLevel: 0,
  firstSave: Date.now(),
  lastRuleRef: 0,
  __v: SAVE_VERSION
};

function deepDefault(){ return JSON.parse(JSON.stringify(DEFAULT_STATE)); }

function migrateWordRecord(v){
  if(v === true) return { b:1, n:1, e:0, c:1, s:Date.now(), d:Date.now() + SRS_STEPS[1] };
  if(v && typeof v === 'object'){
    return {
      b: typeof v.b === 'number' ? v.b : 0,
      n: typeof v.n === 'number' ? v.n : 0,
      e: typeof v.e === 'number' ? v.e : 0,
      c: typeof v.c === 'number' ? v.c : 0,
      s: v.s || Date.now(),
      d: typeof v.d === 'number' ? v.d : 0
    };
  }
  return { b:0, n:0, e:0, c:0, s:Date.now(), d:0 };
}

function loadState(){
  const d = deepDefault();
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(raw){
      const p = JSON.parse(raw);
      Object.assign(d, p);
      d.boosts = Object.assign({}, DEFAULT_STATE.boosts, p.boosts || {});
      delete d.boosts.hints;
      if(typeof d.boosts.smartReview !== 'number') d.boosts.smartReview = 0;
      d.completed = p.completed || {};

/* Parse VOCAB with new 6-field format */
const ALL_WORDS = [];
Object.keys(VOCAB).forEach(cat => {
  VOCAB[cat].words.forEach(w => {
    const parts = w.split('|');
    const en = parts[0];
    const ru = parts[1];
    const ipa = parts[2] || '';
    const coll = parts[3] || '';
    const ex = parts[4] || '';
    const exRu = parts[5] || '';
    ALL_WORDS.push({
      en: en, ru: ru, ipa: ipa, coll: coll, ex: ex, exRu: exRu, cat: cat,
      kind: en.indexOf(' ') >= 0 ? 'phrase' : 'word'
    });
  });
});
const CAT_LIST = Object.keys(VOCAB);

const WORD_INDEX = {};
ALL_WORDS.forEach(w => { WORD_INDEX[w.en.toLowerCase()] = w; });

/* =========================================================
   6. WHY HINTS (fixed)
   ========================================================= */
function autoWhy(ex){
  if(ex.why) return ex.why;
  const txt = ((ex.q || '') + ' ' + (ex.ru || '') + ' ' + (ex.tokens || []).join(' ')).toLowerCase();
  // I / am
  if(/\bi\b/.test(txt) && /\bam\b/.test(txt)) return 'С I всегда am.';
  // he/she/it + is
  if(/\b(he|she|it)\b/.test(txt) && /\bis\b/.test(txt)) return 'С he / she / it используем is.';
  // you/we/they + are
  if(/\b(you|we|they)\b/.test(txt) && /\bare\b/.test(txt)) return 'С we / you / they используем are.';
  // doesn't with he/she/it
  if(/doesn['’]?t/.test(txt) && /\b(he|she|it)\b/.test(txt)) return 'С he / she / it — doesn\'t.';
  // don't with he/she/it → wrong
  if(/\bdon['’]?t\b/.test(txt) && /\b(he|she|it)\b/.test(txt)) return 'С he/she/it нужно doesn\'t, а не don\'t.';
  // don't with I/you/we/they
  if(/\bdon['’]?t\b/.test(txt) && /\b(i|you|we|they)\b/.test(txt)) return 'С I / you / we / they — don\'t.';
  // does question
  if(/\bdoes\b/.test(txt) && /\b(he|she|it)\b/.test(txt)) return 'Вопрос с he/she/it — через does.';
  // do question
  if(/\bdo\b/.test(txt) && /\b(i|you|we|they)\b/.test(txt)) return 'Вопрос — через do.';
  if(/\bcan\b/.test(txt)) return 'После can глагол без to и без -s.';
  if(/want to|would like to/.test(txt)) return 'После would like / want — to + V1.';
  if(/\bwent\b/.test(txt) || /\bdid\b/.test(txt)) return 'Past Simple: did + V1, отрицание didn\'t + V1.';
  if(/-ing\b/.test(txt)) return 'Действие сейчас → am/is/are + V-ing.';
  if(/\b(he|she|it)\b/.test(txt) && /(go|watch|study)/.test(txt)) return 'He/she/it + глагол с -s: goes, watches, studies.';
  return '';
}

/* Accepted alt forms */
const ACCEPT_ALTS = {
  "i am":"i'm", "i'm":"i am",
  "he is":"he's", "he's":"he is",
  "she is":"she's", "she's":"she is",
  "it is":"it's", "it's":"it is",
  "we are":"we're", "we're":"we are",
  "you are":"you're", "you're":"you are",
  "they are":"they're", "they're":"they are",
  "is not":"isn't", "isn't":"is not",
  "are not":"aren't", "aren't":"are not",
  "do not":"don't", "don't":"do not",
  "does not":"doesn't", "doesn't":"does not",
  "cannot":"can't", "can't":"cannot",
  "will not":"won't", "won't":"will not",
  "would like":"'d like", "'d like":"would like",
  "colour":"color", "color":"colour",
  "favourite":"favorite", "favorite":"favourite",
  "i am going to":"i'm going to", "i'm going to":"i am going to"
};
function normEn(s){
  return String(s == null ? '' : s).toLowerCase().trim()
    .replace(/[.,!?;:'"`’]/g, '')
    .replace(/\s+/g, ' ');
}
function applyAlts(s){
  const k = s.trim();
  return ACCEPT_ALTS[k] || s;
}
function lev(a, b){
  const m = a.length, n = b.length;
  if(!m) return n;
  if(!n) return m;
  let prev = new Array(n + 1);
  for(let j = 0; j <= n; j++) prev[j] = j;
  for(let i = 1; i <= m; i++){
    const cur = [i];
    for(let j = 1; j <= n; j++){
      cur[j] = Math.min(prev[j] + 1, cur[j-1] + 1, prev[j-1] + (a[i-1] === b[j-1] ? 0 : 1));
    }
    prev = cur;
  }
  return prev[n];
}
function looseEq(a, b){
  let na = normEn(a), nb = normEn(b);
  if(!na || !nb) return false;
  if(na === nb) return true;
  const naAlt = applyAlts(na), nbAlt = applyAlts(nb);
  if(naAlt === nbAlt) return true;
  const d = lev(na, nb);
  const len = Math.max(na.length, nb.length);
  // B4 + 1.4 fix: strict distance based on answer length
  const ansLen = nb.length;
  const maxDist = ansLen <= 4 ? 1 : (ansLen <= 8 ? 1 : 2);
  if(d <= maxDist) return true;
  return false;
}
function editDistance(a, b){ return lev(normEn(a), normEn(b)); }

/* =========================================================
   14. SRS
   ========================================================= */
const SRS = {
  get(en){
    const idx = WORD_INDEX[String(en || '').toLowerCase()];
    if(!idx) return null;
    const key = idx.en;
    let w = S.words[key];
    if(!w || typeof w !== 'object'){
      w = S.words[key] = { b:0, n:0, e:0, c:0, s:Date.now(), d:0 };
    }
    return w;
  },
  learn(en, ok){
    const w = SRS.get(en);
    if(!w) return null;
    if(ok){
      w.b = Math.min(SRS_STEPS.length - 1, (w.b || 0) + 1);
      w.n = (w.n || 0) + 1;
    } else {
      w.b = Math.max(0, (w.b || 0) - 2);
      w.e = (w.e || 0) + 1;
    }
    w.c = (w.c || 0) + 1;
    w.s = Date.now();
    w.d = Date.now() + SRS_STEPS[w.b];
    return w;
  },
  add(en, box){
    const w = SRS.get(en);
    if(!w) return null;
    if(w.c > 0) return w;
    w.b = (typeof box === 'number') ? box : 1;
    w.n = 1; w.e = 0; w.c = 1;
    w.s = Date.now();
    w.d = Date.now() + SRS_STEPS[w.b];
    return w;
  },
  due(en){
    const idx = WORD_INDEX[String(en || '').toLowerCase()];
    if(!idx) return false;
    const w = S.words[idx.en];
    if(!w || typeof w !== 'object') return false;
    return (w.d || 0) <= Date.now();
  },
  dueCount(){
    let n = 0;
    Object.keys(S.words).forEach(en => {
      const w = S.words[en];
      if(w && typeof w === 'object' && (w.d || 0) <= Date.now()) n++;
    });
    return n;
  },
  weak(n){
    return Object.keys(S.words)
      .filter(en => S.words[en] && typeof S.words[en] === 'object')
      .sort((a, b) => {
        const wa = S.words[a], wb = S.words[b];
        return (wa.b - wb.b) || (wb.e - wa.e) || (wa.s - wb.s);
      })
      .slice(0, n);
  },
  strength(en){
    const idx = WORD_INDEX[String(en || '').toLowerCase()];
    if(!idx) return 0;
    const w = S.words[idx.en];
    if(!w || typeof w !== 'object') return 0;
    if(w.b >= 5) return 3;
    if(w.b >= 3) return 2;
    if(w.b >= 1) return 1;
    return 0;
  }
};
function strengthDots(en){
  const s = SRS.strength(en);
  return '●'.repeat(s) + '○'.repeat(3 - s);
}

/* =========================================================
   15. HEARTS / STREAK / ACHIEVEMENTS
   ========================================================= */
const HEART_REGEN_MS = 3 * 60 * 1000;

function regenHearts(){
  if(S.hearts >= S.maxHearts) return;
  const elapsed = Date.now() - S.lastHeartTime;
  const gained = Math.floor(elapsed / HEART_REGEN_MS);
  if(gained > 0){
    S.hearts = Math.min(S.maxHearts, S.hearts + gained);
    S.lastHeartTime += gained * HEART_REGEN_MS;
    save();
    updateTop();
  }
}
function loseHeart(){
  if(S.hearts > 0){
    S.hearts--;
    if(S.hearts === S.maxHearts - 1) S.lastHeartTime = Date.now();
    save();
    updateTop();
  }
}
function checkStreak(){
  const today = new Date().toDateString();
  if(S.lastDay === today) return;
  const yest = new Date(Date.now() - 86400000).toDateString();
  if(S.lastDay === yest){
    S.streak++;
  } else if(S.lastDay === null){
    S.streak = 1;
  } else {
    if(S.boosts.shield > 0){
      S.boosts.shield--;
      toast('🛡️ Защита стрика использована!');
      S.streak++;
    } else {
      S.streak = 1;
    }
  }
  S.lastDay = today;
  save();
}
function checkAchievements(){
  let unlocked = false;
  ACHIEVEMENTS.forEach(a => {
    if(!S.achievements.includes(a.id) && a.check()){
      S.achievements.push(a.id);
      unlocked = true;
      toast('🏆 Достижение: ' + a.name);
      SFX.coin();
      if(S.achievements.length % 2 === 0) confetti();
    }
  });
  if(unlocked){ save(); }
  return unlocked;
}
function awardXP(amount){
  const mult = Date.now() < S.doubleUntil ? 2 : 1;
  const gained = amount * mult;
  S.xp += gained;
  if(!S.history) S.history = {};
  const k = dayKey();
  S.history[k] = (S.history[k] || 0) + gained;
  save();
  updateTop();
  return gained;
}

function modulePrereqMet(mi){
  if(mi === 0) return true;
  if(S.placementDone && mi <= (S.placementLevel || 0)) return true;
  const prev = MODULES[mi - 1];
  if(!prev) return true;
  const total = prev.lessons.length;
  const done = prev.lessons.filter((_, j) => S.completed[prev.id + '_' + j]).length;
  return (done / total) >= 0.7;
}

function plural(n, one, few, many){
  const m10 = n % 10, m100 = n % 100;
  if(m10 === 1 && m100 !== 11) return one;
  if(m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return few;
  return many;
}

function buyTheme(key){
  const t = THEMES[key];
  if(S.ownedThemes.includes(key)){
    S.theme = key;
    applyTheme(key);
    save(true);
    SFX.click();
    haptic('light');
    toast('🎨 Тема «' + t.name + '» применена');
    renderShop();
    return;
  }
  if(S.gems < t.price){
    SFX.wrong(); haptic('error');
    toast('💎 Недостаточно кристаллов');
    return;
  }
  S.gems -= t.price;
  S.ownedThemes.push(key);
  S.theme = key;
  S.purchases++;
  applyTheme(key);
  save(true);
  SFX.coin(); haptic('success');
  toast('🎉 Тема «' + t.name + '» куплена!');
  updateTop();
  checkAchievements();
  renderShop();
}
function buyBoost(id){
  const b = BOOSTS.find(x => x.id === id);
  if(!b) return;
  if(S.gems < b.price){
    SFX.wrong(); haptic('error');
    toast('💎 Недостаточно кристаллов');
    return;
  }
  S.gems -= b.price;
  S.purchases++;

  if(id === 'restore'){
    S.hearts = S.maxHearts;
    toast('💖 Жизни восстановлены 5/5');
  }
  if(id === 'shield'){
    S.boosts.shield++;
    toast('🛡️ Защита стрика: ×' + S.boosts.shield);
  }
  if(id === 'double'){
    S.doubleUntil = Date.now() + 30 * 60 * 1000;
    toast('⚡ Двойной XP на 30 минут!');
  }
  if(id === 'hints'){
    S.hintsUntil = Date.now() + 30 * 60 * 1000;
    toast('💡 Подсказки активны 30 минут!');
  }
  if(id === 'smart'){
    S.boosts.smartReview = 1;
    save(true);
    SFX.coin(); haptic('success');
    updateTop();
    startSmartReview();
    return;
  }

  save(true);
  SFX.coin(); haptic('success');
  updateTop();
  checkAchievements();
  renderShop();
}

function startSmartReview(){
  if(S.hearts <= 0){ showNoHearts(); return; }
  const weak = SRS.weak(10);
  if(weak.length < 4){
    toast('Пока мало слов для умного повтора');
    S.boosts.smartReview = 0;
    save();
    return;
  }
  const pool = weak.map(en => WORD_INDEX[en.toLowerCase()]).filter(Boolean);
  if(pool.length < 4){ toast('Пока мало слов'); S.boosts.smartReview = 0; save(); return; }
  const quiz  = buildQuiz(shuffle(pool), 6);
  const types = shuffle(pool).slice(0, 3).map(w => T(w.ru, w.en, w.en));
  const match = M(shuffle(pool).slice(0, 4).map(w => [w.en, w.ru]));
  const exs = shuffle(quiz.concat(types, [match]));

  closeSheet();
  P.ex = exs.map((e, i) => ({ ex: e, isRetry: false, origIdx: i }));
  P.i = 0; P.correct = 0; P.wrong = 0; P.xp = 0; P.gems = 0;
  P.isPractice = true;
  P.isPlacement = false;
  P.moduleId = null;
  P.lessonIdx = -1;
  P.lessonTitle = 'Умный повтор';
  P.wordsToLearn = [];
  P.retriesUsed = {};
  P.failedWords = [];
  P.results = [];
  P.retryCount = 0;
  P.recentCorrect = 0;
  P.recentTimes = [];
  S.boosts.smartReview = 0;
  save(true);
  openPlayer();
}

function renderHeatmapHTML(){
  const today = new Date(); today.setHours(0,0,0,0);
  const dow = (today.getDay() + 6) % 7;
  const start = new Date(today);
  start.setDate(start.getDate() - (12 * 7 + dow));
  const cells = [];
  let max = 0;
  for(let i = 0; i < 91; i++){
    const d = new Date(start);
    d.setDate(d.getDate() + i);
    const k = dayKey(d);
    const v = (S.history && S.history[k]) || 0;
    if(v > max) max = v;
    cells.push({ d, k, v });
  }
  function lvl(v){
    if(v <= 0) return 0;
    if(max <= 0) return 0;
    const r = v / max;
    if(r < 0.25) return 1;
    if(r < 0.5)  return 2;
    if(r < 0.75) return 3;
    return 4;
  }
  let html = '<div class="heatmap">';
  const monthNames = ['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
  const monthMarks = [];
  let lastMonth = -1;
  cells.forEach((c, i) => {
    const l = lvl(c.v);
    const title = c.k + ' · ' + c.v + ' XP';
    html += `<button class="hmc l${l}" data-action="hmcTap" data-k="${c.k}" data-v="${c.v}" aria-label="${c.k}: ${c.v} XP" title="${title}"></button>`;
    if(c.d.getMonth() !== lastMonth && c.d.getDate() <= 7){
      lastMonth = c.d.getMonth();
      monthMarks.push({ idx: i, name: monthNames[lastMonth] });
    }
  });
  html += '</div>';
  // month labels
  html += '<div class="heatMonths">';
  monthMarks.slice(0, 4).forEach(m => {
    html += `<span>${m.name}</span>`;
  });
  html += '</div>';
  return html;
}

function hmcTap(k, v){
  const tip = $('#htTip');
  if(!tip) return;
  // count words learned that day? we don't have per-day word tracking — show XP only
  tip.textContent = k + ' · ' + v + ' XP';
  tip.classList.add('show');
  clearTimeout(tip._to);
  tip._to = setTimeout(() => tip.classList.remove('show'), 1800);
  // position
  try{
    const btn = document.activeElement;
    if(btn && btn.getBoundingClientRect){
      const r = btn.getBoundingClientRect();
      tip.style.left = Math.max(8, r.left + r.width/2 - 60) + 'px';
      tip.style.top = (r.top - 34) + 'px';
    }
  }catch(e){}
}

function importProgress(){

  if(!raw) return;
  try{
    const parsed = JSON.parse(raw);
    if(!parsed || typeof parsed !== 'object') throw new Error('bad');
    if(typeof parsed.__v === 'number' && parsed.__v > SAVE_VERSION){
      toast('⚠️ Файл новее этой версии');
      return;
    }
    if(!parsed.words) parsed.words = {};
    Object.keys(parsed.words).forEach(k => { parsed.words[k] = migrateWordRecord(parsed.words[k]); });
    S = Object.assign(deepDefault(), parsed);
    S.boosts = Object.assign({}, DEFAULT_STATE.boosts, parsed.boosts || {});
    save(true);
    toast('📥 Прогресс импортирован. Перезагрузка…');
    setTimeout(() => location.reload(), 800);
  }catch(e){
    toast('❌ Некорректный формат');
  }
}

function savePassportPNG(){
  try{
    const W = 600, H = 360;
    const canvas = document.createElement('canvas');
    canvas.width = W; canvas.height = H;
    const ctx = canvas.getContext('2d');
    const theme = THEMES[S.theme] || THEMES.dark;

    const g = ctx.createLinearGradient(0, 0, W, H);
    g.addColorStop(0, theme.v.bg);
    g.addColorStop(1, theme.v.bg2);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    const rg = ctx.createRadialGradient(W - 60, 60, 10, W - 60, 60, 200);
    rg.addColorStop(0, 'rgba(255,182,72,0.25)');
    rg.addColorStop(1, 'rgba(255,182,72,0)');
    ctx.fillStyle = rg;
    ctx.fillRect(0, 0, W, H);

    ctx.strokeStyle = theme.v.accent;
    ctx.lineWidth = 2;
    ctx.strokeRect(20.5, 20.5, W - 41, H - 41);

    ctx.fillStyle = theme.v.muted;
    ctx.font = 'bold 12px system-ui, -apple-system, Arial';
    ctx.fillText('CEFR LEVEL', 40, 60);
    ctx.fillStyle = theme.v.accent;
    ctx.font = 'bold 46px system-ui, -apple-system, Arial';
    ctx.fillText('A1', 40, 110);

    ctx.fillStyle = theme.v.text;
    ctx.font = 'bold 18px system-ui, -apple-system, Arial';
    ctx.fillText('A1 English Master — Student Passport', 40, 150);

    const rows = [
      ['Слов изучено', String(Object.keys(S.words).length)],
      ['Уроков пройдено', Object.keys(S.completed).length + '/' + MODULES.reduce((s, m) => s + m.lessons.length, 0)],
      ['Верных ответов', String(S.totalCorrect)],
      ['Дней подряд', String(S.streak)],
      ['Уровень', String(level())],
      ['Всего XP', String(S.xp)]
    ];
    rows.forEach((r, i) => {
      const col = i % 2;
      const row = Math.floor(i / 2);
      const x = 40 + col * 260;
      const y = 200 + row * 42;
      ctx.fillStyle = theme.v.muted;
      ctx.font = 'bold 10px system-ui, -apple-system, Arial';
      ctx.fillText(r[0].toUpperCase(), x, y);
      ctx.fillStyle = theme.v.text;
      ctx.font = 'bold 18px system-ui, -apple-system, Arial';
      ctx.fillText(r[1], x, y + 22);
    });

    ctx.fillStyle = theme.v.muted;
    ctx.font = 'bold 11px system-ui, -apple-system, Arial';
    const reg = new Date(S.firstSave || Date.now());
    const dateStr = String(reg.getDate()).padStart(2,'0') + '.' + String(reg.getMonth()+1).padStart(2,'0') + '.' + reg.getFullYear();
    ctx.fillText('ВЫДАН: A1 ENGLISH MASTER · ' + dateStr, 40, H - 40);

    const dataUrl = canvas.toDataURL('image/png');
    const a = document.createElement('a');
    a.href = dataUrl;
    a.download = 'a1-passport-' + Date.now() + '.png';
    document.body.appendChild(a);
    a.click();
    setTimeout(() => a.remove(), 100);
    toast('📸 Паспорт сохранён');
  }catch(e){
    toast('Не удалось сохранить PNG');
  }
}

      const b = buttons[+btn.dataset.mb];
      SFX.tap();
      if(b && b.action) b.action();
    };
  });
  // focus trap
  const first = btnEls[0];
  if(first) setTimeout(() => first.focus(), 50);
  $('#modal').onkeydown = (e) => {
    if(e.key === 'Tab'){
      const focusables = btnEls;
      if(!focusables.length) return;
      const idx = focusables.indexOf(document.activeElement);
      if(e.shiftKey && (idx <= 0)){ e.preventDefault(); focusables[focusables.length-1].focus(); }
      else if(!e.shiftKey && idx === focusables.length-1){ e.preventDefault(); focusables[0].focus(); }
    }
    if(e.key === 'Escape') closeModal();
  };
}

  $('#modal').innerHTML = '';
  $('#modal').onkeydown = null;

function startLesson(mi, li){
  closeSheet();
  if(S.hearts <= 0){ showNoHearts(); return; }

  const m = MODULES[mi];
  const lesson = m.lessons[li];

  let exs = lesson.ex.map(e => JSON.parse(JSON.stringify(e)));

  // add word-type exercises from current lesson
  P.wordsToLearn = collectWords(m.cats, 10);
  const tw = shuffle(P.wordsToLearn).slice(0, 3);
  tw.forEach(w => exs.push(T(w.ru, w.en, w.en)));

  // interleaving: every 3rd exercise inject a review item from previous modules
  const interleaved = [];
  exs.forEach((e, idx) => {
    interleaved.push({ ex: e, isRetry: false, origIdx: -1, isReview: false });
    if(idx % 3 === 2 && mi > 0){
      const prevWord = pickPreviousWord(mi);
      if(prevWord){
        const revEx = T(prevWord.ru, prevWord.en, prevWord.en);
        interleaved.push({ ex: revEx, isRetry: false, origIdx: -1, isReview: true });
      }
    }
  });

  // assign origIdx only to non-review
  let origCounter = 0;
  interleaved.forEach(item => {
    if(!item.isReview) item.origIdx = origCounter++;
  });

  P.ex = interleaved;
  P.i = 0; P.correct = 0; P.wrong = 0; P.xp = 0; P.gems = 0;
  P.isPractice = false;
  P.isPlacement = false;
  P.moduleId = m.id;
  P.lessonIdx = li;
  P.lessonTitle = lesson.title;
  P.retriesUsed = {};
  P.failedWords = [];
  P.results = new Array(P.ex.length).fill(null);
  P.retryCount = 0;
  P.recentCorrect = 0;
  P.recentTimes = [];
  P.__isRuleShown = false;

  // Rule of the day card, then start
  showRuleCard(m, () => openPlayer());
}

function pickPreviousWord(currentMi){
  const prevMods = MODULES.slice(0, currentMi);
  const pool = [];
  prevMods.forEach(m => {
    m.cats.forEach(cat => {
      if(VOCAB[cat]){
        VOCAB[cat].words.forEach(w => {
          const p = w.split('|');
          if(p[0] && p[1]) pool.push({ en: p[0], ru: p[1] });
        });
      }
    });
  });
  if(!pool.length) return null;
  return pool[Math.floor(Math.random() * pool.length)];
}

function showRuleCard(m, onContinue){
  if(typeof m.gRef !== 'number' || !GRAMMAR[m.gRef]){
    onContinue();
    return;

  const rule = GRAMMAR[m.gRef];
  const titleClean = rule.t.replace(/^\d+\.\s*/, '');
  showModal({
    icon:'book',

    text:'Откройте справочник, если хотите освежить тему перед уроком.',
    buttons:[

    ]
  });
}

function collectWords(cats, n){
  let pool = ALL_WORDS.filter(w => cats.indexOf(w.cat) >= 0 && !S.words[w.en]);
  if(pool.length < n){
    pool = pool.concat(ALL_WORDS.filter(w => cats.indexOf(w.cat) >= 0 && S.words[w.en]));
  }
  if(pool.length < n) pool = pool.concat(ALL_WORDS.filter(w => !S.words[w.en]));
  return shuffle(pool).slice(0, n);
}

function startPractice(mode, cat){
  closeSheet();
  if(S.hearts <= 0){ showNoHearts(); return; }

  let exs = [];
  const catWords = cat
    ? VOCAB[cat].words.map(w => { const p = w.split('|'); return { en: p[0], ru: p[1], cat: cat, coll: p[3] || '', ipa: p[2] || '' }; })
    : ALL_WORDS;

  const pool = shuffle(catWords);

  if(mode === 'flash'){
    exs = pool.slice(0, 12).map(w => F(w.en, w.ru, w.coll, w.ipa));
    P.wordsToLearn = pool.slice(0, 12);
  } else if(mode === 'quiz'){
    exs = buildQuiz(pool, 12);
    P.wordsToLearn = [];
  } else if(mode === 'type'){
    exs = pool.slice(0, 10).map(w => T(w.ru, w.en, w.en));
    P.wordsToLearn = pool.slice(0, 10);
  } else if(mode === 'match'){
    for(let i = 0; i < 4; i++){
      const chunk = pool.slice(i * 4, i * 4 + 4).map(w => [w.en, w.ru]);
      if(chunk.length === 4) exs.push(M(chunk));
    }
    if(!exs.length) exs = [M(pool.slice(0,4).map(w=>[w.en,w.ru]))];
    P.wordsToLearn = [];
  } else if(mode === 'build'){
    exs = shuffle(SENTENCE_POOL).slice(0, 10).map(s => B(shuffle(s.en), s.en, s.ru));
    P.wordsToLearn = [];
  } else if(mode === 'error'){
    exs = shuffle(ERROR_POOL).slice(0, 10).map(e => E(e.tokens.slice(), e.wrong));
    P.wordsToLearn = [];
  } else if(mode === 'mixed'){
    const quiz = buildQuiz(pool, 4);
    const types = pool.slice(0, 3).map(w => T(w.ru, w.en, w.en));
    const builds = shuffle(SENTENCE_POOL).slice(0, 3).map(s => B(shuffle(s.en), s.en, s.ru));
    const errs = shuffle(ERROR_POOL).slice(0, 3).map(e => E(e.tokens.slice(), e.wrong));
    const matches = [M(pool.slice(0, 4).map(w => [w.en, w.ru]))];
    const flash = pool.slice(4, 6).map(w => F(w.en, w.ru, w.coll, w.ipa));
    exs = shuffle(quiz.concat(types, builds, errs, matches, flash));
    P.wordsToLearn = pool.slice(0, 6);
  }

  if(!exs.length){ toast('Недостаточно данных'); return; }

  P.ex = exs.map((e, i) => ({ ex: e, isRetry: false, origIdx: i, isReview: false }));
  P.i = 0; P.correct = 0; P.wrong = 0; P.xp = 0; P.gems = 0;
  P.isPractice = true;
  P.isPlacement = false;
  P.moduleId = null;
  P.lessonIdx = -1;
  P.lessonTitle = 'Практика';
  P.retriesUsed = {};
  P.failedWords = [];
  P.results = new Array(P.ex.length).fill(null);
  P.retryCount = 0;
  P.recentCorrect = 0;
  P.recentTimes = [];

  openPlayer();
}

function startReview(){
  if(S.hearts <= 0){ showNoHearts(); return; }

  let dueWords = Object.keys(S.words).filter(en => SRS.due(en));
  if(dueWords.length < 6){
    const weak = SRS.weak(12).filter(en => dueWords.indexOf(en) < 0);
    dueWords = dueWords.concat(weak);
  }
  if(dueWords.length < 4){
    toast('Пока нечего повторять — пройди ещё уроков 🌱');
    return;
  }
  const pool = dueWords
    .map(en => WORD_INDEX[en.toLowerCase()])
    .filter(Boolean);
  if(pool.length < 4){ toast('Пока нечего повторять 🌱'); return; }

  const quiz  = buildQuiz(shuffle(pool), 6);
  const types = shuffle(pool).slice(0, 3).map(w => T(w.ru, w.en, w.en));
  const pairs = shuffle(pool).slice(0, 4).map(w => [w.en, w.ru]);
  const match = M(pairs);
  const exs = shuffle(quiz.concat(types, [match]));

  P.ex = exs.map((e, i) => ({ ex: e, isRetry: false, origIdx: i, isReview: false }));
  P.i = 0; P.correct = 0; P.wrong = 0; P.xp = 0; P.gems = 0;
  P.isPractice = true;
  P.isPlacement = false;
  P.moduleId = null;
  P.lessonIdx = -1;
  P.lessonTitle = 'Умное повторение';
  P.wordsToLearn = [];
  P.retriesUsed = {};
  P.failedWords = [];
  P.results = new Array(P.ex.length).fill(null);
  P.retryCount = 0;
  P.recentCorrect = 0;
  P.recentTimes = [];

  SFX.click();
  openPlayer();
}

function buildQuiz(pool, n){
  const out = [];
  const used = new Set();
  const shuffled = shuffle(pool);
  for(let i = 0; i < shuffled.length && out.length < n; i++){
    const w = shuffled[i];
    if(used.has(w.en)) continue;
    used.add(w.en);

    let distract = pool.filter(x => x.en !== w.en && x.cat && x.cat === w.cat);
    distract = shuffle(distract);
    if(distract.length < 3){
      const others = shuffle(pool.filter(x => x.en !== w.en && (!x.cat || x.cat !== w.cat)));
      distract = distract.concat(others);
    }
    const seenRu = new Set([w.ru]);
    distract = distract.filter(d => {
      if(seenRu.has(d.ru)) return false;
      seenRu.add(d.ru);
      return true;
    }).slice(0, 3);
    if(distract.length < 3) continue;

    const dir = Math.random() < 0.5;
    if(dir){
      const opts = shuffle([w.ru].concat(distract.map(d => d.ru)));
      out.push(MC('Переведите: «' + w.en + '»', opts, opts.indexOf(w.ru), w.ru, w.en));
    } else {
      const opts = shuffle([w.en].concat(distract.map(d => d.en)));
      out.push(MC('Выберите английский вариант: «' + w.ru + '»', opts, opts.indexOf(w.en), w.en, w.en));
    }
  }
  return out;
}

function useHint(){

function transitionEx(cb){

  const reduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduced){ cb(); return; }

  setTimeout(() => {

}

function renderEx(){
  if(P.i >= P.ex.length){ renderResult(); return; }
  const item = P.ex[P.i];
  if(!item) { renderResult(); return; }
  const ex = item.ex;

  P.answered = false;
  P.sel = null;
  P.dlgStep = 0;

             <div id="diffHint"></div>`;
  }

  else if(ex.type === 'build'){
    P.bank = shuffle(ex.words);
    P.picked = [];
    let buildHint = '';
    if(item.isRetry && ex.answer){
      buildHint = `<div class="exHint">Шаблон: ${ex.answer.map((_, idx) => '[' + (['Subject','Verb','Object','Adverb','?'][idx] || '·') + ']').join(' + ')}</div>`;
    }

             ${buildHint}
             <div class="buildArea" id="buildArea"></div>
             <div class="bank" id="bank"></div>`;
  }

  else if(ex.type === 'error'){
    html += `${badges}<div class="exHead">Найдите ошибку в предложении</div>
             <div class="exQ" style="font-size:15px;color:var(--muted);margin-bottom:16px">Нажмите на неправильное слово</div>
             <div class="tokens">`;
    ex.tokens.forEach((t, i) => {
      html += `<button class="tok" data-i="${i}" data-action="pickTok">${t}</button>`;
    });
    html += `</div>`;
  }

  else if(ex.type === 'match'){
    P.mLeft  = shuffle(ex.pairs.map((p, i) => ({ t: p[0], i: i })));
    P.mRight = shuffle(ex.pairs.map((p, i) => ({ t: p[1], i: i })));
    html += `${badges}<div class="exHead">Сопоставьте пары</div>
             <div class="matchWrap">
               <div class="mcol" id="mLeft"></div>
               <div class="mcol" id="mRight"></div>
             </div>`;
    mb.style.display = 'none';
  }

  else if(ex.type === 'flash'){
    html += `${badges}<div class="exHead">Запомните слово</div>
             <div class="flashwrap">
               <div class="flashcard" id="flashcard" data-action="flipCard">
                 <div class="fcFace fcFront">${ex.en}${ex.ipa ? '<div class="fcIpa">' + ex.ipa + '</div>' : ''}</div>
                 <div class="fcFace fcBack">${ex.ru}${ex.coll ? '<div class="fcColl">' + ex.coll + '</div>' : ''}</div>
               </div>
             </div>
             <div class="flashBtns">
               <button class="btn ghost" data-action="flashAnswer" data-known="0">${iconRaw('refresh')}<span>Повторить</span></button>

  if(ex.type === 'match') renderMatch();

    const inp = $('#typeIn');
    if(inp){
      // for retry: show first letter
      if(item.isRetry && ex.ans){
        inp.placeholder = 'Подсказка: ' + ex.ans[0] + '… (' + ex.ans.length + ' симв.)';
      }
      inp.addEventListener('keydown', e => {
        if(e.key === 'Enter'){ e.preventDefault(); if(!P.answered) mainAction(); }
      });
      setTimeout(() => { try{ inp.focus(); }catch(e){} }, 80);
    }
  }
}

function renderDialogInto(container, ex){
  const charA = ex.charA || CHARS.anna;
  const charB = ex.charB || CHARS.tom;

  let histHtml = '';
  P.dlgHistory.forEach(h => {
    histHtml += `<div class="dlgLine ${h.who.toLowerCase()}">
      <div class="dlgWho ${h.who.toLowerCase()}">${h.who === 'A' ? charA.avatar : charB.avatar}</div>
      <div class="dlgTxt">${h.text}</div>
    </div>`;
  });

  const lineA = ex.lines[P.dlgStep];
  if(lineA && lineA.who === 'B'){
    histHtml += `<div class="dlgLine b">
      <div class="dlgWho b">${charB.avatar}</div>
      <div class="dlgTxt">${lineA.text}</div>
    </div>`;
  }
  const lineB = ex.lines[P.dlgStep + 1];
  let optsHtml = '';
  if(lineB && lineB.opts){
    optsHtml = `<div class="opts" style="margin-top:14px">`;
    lineB.opts.forEach((o, i) => {
      optsHtml += `<button class="opt" data-i="${i}" data-action="pickDlgOpt">${o}</button>`;
    });

  }

    <div class="dlgChar">

      <div>
        <div class="dlgName">${charA.name}</div>
        <div class="dlgRole">${charA.role}</div>
      </div>
    </div>
    <div class="dlgScene">${ex.scene}</div>
    <div class="dlgHist">${histHtml}</div>
    <div class="exHead" style="margin-top:0">Ваш ответ:</div>
    ${optsHtml}
  `;
  const mb = $('#mainBtn');
  mb.style.display = 'none';
}

function pickDlgOpt(i){
  if(P.answered) return;
  const item = P.ex[P.i];
  const ex = item.ex;
  const lineB = ex.lines[P.dlgStep + 1];
  if(!lineB) return;
  P.sel = i;
  SFX.tap(); haptic('light');
  $$('.opt').forEach(b => {
    b.style.borderColor = '';
    b.style.background = '';
    if(+b.dataset.i === i){
      b.style.borderColor = 'var(--primary)';
      b.style.background = 'color-mix(in srgb,var(--primary) 14%,transparent)';
    }
  });
  setTimeout(() => evaluateDialogStep(), 180);
}

function evaluateDialogStep(){
  const item = P.ex[P.i];
  const ex = item.ex;
  const lineB = ex.lines[P.dlgStep + 1];
  if(!lineB || P.sel === null) return;

  const ok = P.sel === lineB.correct;
  $$('.opt').forEach((b, i) => {
    b.classList.add('disabled');
    b.style.borderColor = ''; b.style.background = '';
    if(i === lineB.correct) b.classList.add('correct');
    if(i === P.sel && !ok) b.classList.add('wrong');
  });

  P.dlgHistory.push({ who:'A', text: lineB.opts[lineB.correct] });

  if(!ok){
    P.mMistakes = (P.mMistakes || 0) + 1;
    SFX.wrong(); haptic('error');
    loseHeart();
    updateHeartsUI();
    if(lineB.why) setTimeout(() => toast('💡 ' + lineB.why), 250);
  } else {
    SFX.click();
  }

  P.dlgStep += 2;

  if(P.dlgStep < ex.lines.length){
    setTimeout(() => {
      const wrap = $('#exWrap');
      renderDialogInto(wrap, ex);
    }, 400);
  } else {
    setTimeout(() => finishDialog(ok), 400);
  }
}

function finishDialog(lastOk){
  const item = P.ex[P.i];
  const ex = item.ex;
  P.answered = true;
  const ok = (P.mMistakes || 0) === 0;

  if(!item.isRetry && !item.isReview){
    P.results[P.i] = ok ? 'ok' : 'err';
  } else if(item.isReview){
    P.results[P.i] = ok ? 'ok' : 'err';
  }

  if(ok){
    P.correct++;
    S.totalCorrect++;
    const g = awardXP(15);
    P.xp += g;
    SFX.correct(); haptic('success');
    setFeedback(true, pickPraise(), '+ ' + g + ' XP');
  } else {
    P.wrong++;
    setFeedback(false, pickOops(), 'Диалог завершён с ' + P.mMistakes + ' ошибк(ами)');
  }
  save();
  const mb = $('#mainBtn');
  mb.style.display = 'flex';
  mb.className = 'btn ok';
  mb.textContent = 'Продолжить';
  updateDots();
}

function unpickWord(pos){

function renderMatch(){
  const L = $('#mLeft'), R = $('#mRight');
  if(!L || !R) return;
  L.innerHTML = P.mLeft.map(o =>
    `<button class="mchip ${P.mDone[o.i] ? 'done' : ''} ${P.mSelL === o.i ? 'sel' : ''}"
      data-action="mClick" data-side="L" data-i="${o.i}">${o.t}</button>`
  ).join('');
  R.innerHTML = P.mRight.map(o =>
    `<button class="mchip ${P.mDone[o.i] ? 'done' : ''} ${P.mSelR === o.i ? 'sel' : ''}"
      data-action="mClick" data-side="R" data-i="${o.i}">${o.t}</button>`
  ).join('');
}
function mClick(side, i){
  if(P.answered || P.mDone[i]) return;
  SFX.tap(); haptic('light');
  if(side === 'L') P.mSelL = i;
  else P.mSelR = i;
  renderMatch();
  if(P.mSelL !== null && P.mSelR !== null) evaluateMatch();
}
function evaluateMatch(){
  const L = P.mSelL, R = P.mSelR;
  const item = P.ex[P.i];
  const ex = item.ex;
  if(L === R){
    P.mDone[L] = true;
    P.mSelL = null; P.mSelR = null;
    SFX.click();
    renderMatch();
    if(Object.keys(P.mDone).length === ex.pairs.length){
      finishMatch();
    }
  } else {
    P.mMistakes++;
    SFX.wrong(); haptic('error');
    loseHeart();
    updateHeartsUI();
    const lBtn = document.querySelectorAll('#mLeft .mchip')[P.mLeft.findIndex(o => o.i === L)];
    const rBtn = document.querySelectorAll('#mRight .mchip')[P.mRight.findIndex(o => o.i === R)];
    if(lBtn) lBtn.classList.add('err');
    if(rBtn) rBtn.classList.add('err');
    P.mSelL = null; P.mSelR = null;
    setTimeout(() => {
      renderMatch();
      if(S.hearts <= 0) showNoHearts();
    }, 320);
  }
}
function finishMatch(){
  const item = P.ex[P.i];
  const ex = item.ex;
  const ok = P.mMistakes === 0;
  P.answered = true;
  if(!item.isRetry){ P.results[P.i] = ok ? 'ok' : 'err'; }
  else { P.results[P.i] = ok ? 'ok' : 'err'; }

  ex.pairs.forEach(p => SRS.learn(p[0], ok));

  if(ok){
    P.correct++;
    S.totalCorrect++;
    const g = awardXP(15);
    P.xp += g;
    save();

  mb.style.display = 'flex';
  mb.className = 'btn ok';
  mb.textContent = 'Продолжить';
  updateDots();
}

function setFeedback(ok, mainText, xpText, why){
  const fb = $('#feedback');

function mainAction(){
  const item = P.ex[P.i];
  if(!item) return;
  if(!P.answered){
    checkCurrent();
  } else {
    advance();
  }
}

function advance(){
  P.i++;
  if(P.i >= P.ex.length) renderResult();
  else transitionEx(() => renderEx());
}

function checkCurrent(){
  const item = P.ex[P.i];
  const ex = item.ex;

  if(ex.type === 'mc'){
    if(P.sel === null){ toast('Выберите вариант'); return; }
    const ok = P.sel === ex.correct;
    $$('.opt').forEach((b, i) => {
      b.classList.add('disabled');
      b.style.borderColor = ''; b.style.background = '';
      if(i === ex.correct) b.classList.add('correct', 'focus-right');
      if(i === P.sel && !ok) b.classList.add('wrong');
    });
    resolve(ok, ex.opts[ex.correct], autoWhy(ex));
  }

  else if(ex.type === 'type'){
    const inp = $('#typeIn');
    if(!inp) return;
    const val = inp.value;
    if(!val || !val.trim()){ toast('Введите ответ'); return; }
    const ok = looseEq(val, ex.ans);
    inp.disabled = true;
    const dist = editDistance(val, ex.ans);
    const ansLen = normEn(ex.ans).length;
    const maxDist = ansLen <= 4 ? 1 : (ansLen <= 8 ? 1 : 2);
    const minorMistake = !ok && dist <= maxDist;
    if(ok){
      inp.classList.add('correct');
    } else {
      inp.classList.add('wrong');
      const hint = $('#diffHint');
      if(hint) hint.innerHTML = `<div class="diffHint">Почти! Правильно: <b>${ex.ans}</b></div>`;
    }
    resolve(ok, ex.ans, ok ? '' : autoWhy(ex), minorMistake);
  }

  else if(ex.type === 'error'){
    if(P.sel === null){ toast('Нажмите на слово с ошибкой'); return; }
    const ok = P.sel === ex.wrongIndex;
    $$('.tok').forEach((b, i) => {
      b.classList.add('disabled');
      b.style.borderColor = ''; b.style.background = '';
      if(i === ex.wrongIndex) b.classList.add('correct', 'focus-right');
      if(i === P.sel && !ok) b.classList.add('wrong');
    });
    resolve(ok, '«' + ex.tokens[ex.wrongIndex] + '» — здесь ошибка', autoWhy(ex));
  }

  else if(ex.type === 'build'){
    if(!P.picked.length){ toast('Соберите предложение'); return; }
    const attempt = P.picked.map(i => P.bank[i]).join(' ');
    const target = ex.answer.join(' ');
    const ok = attempt === target;
    resolve(ok, target, autoWhy(ex));
  }
}

function resolve(ok, correctText, why, minorMistake){
  const item = P.ex[P.i];
  const ex = item.ex;
  P.answered = true;
  if(!item.isRetry){
    P.results[P.i] = ok ? 'ok' : 'err';
  } else {
    P.results[P.i] = ok ? 'ok' : 'err';
  }
  const mb = $('#mainBtn');
  mb.className = 'btn ok';
  mb.textContent = 'Продолжить';

  // timing
  const elapsed = Date.now() - (P.exStartTime || Date.now());
  P.recentTimes.push(elapsed);
  if(P.recentTimes.length > 10) P.recentTimes.shift();

  if(P.isPlacement){
    P.placementMarks[P.i] = ok;
  }

  if(ex.type === 'mc' && ex.w) SRS.learn(ex.w, ok);
  else if(ex.type === 'type' && ex.w) SRS.learn(ex.w, ok);
  else if(ex.type === 'build') ex.answer.forEach(w => SRS.learn(w, ok));

  // type-task counter for achievements
  if(ex.type === 'type' && ok) S.spellCorrect = (S.spellCorrect || 0) + 1;

  // MC speed: 10 MC correct in a row under 8 sec
  if(ex.type === 'mc' && ok && elapsed < 8000) P.recentCorrect++;
  else if(ex.type === 'mc' && !ok) P.recentCorrect = 0;
  if(P.recentCorrect >= 10){ S.fastCorrect = (S.fastCorrect || 0) + 1; P.recentCorrect = 0; }

  if(ok){
    // retry correct → don't count again
    if(!item.isRetry){
      P.correct++;
      S.totalCorrect++;
      const g = awardXP(10);
      P.xp += g;
      save();
      SFX.correct(); haptic('success');
      setFeedback(true, pickPraise(), '+ ' + g + ' XP');
    } else {
      // retry correct: minimal XP, no count
      const g = awardXP(3);
      P.xp += g;
      save();
      SFX.click();
      setFeedback(true, 'Повтор зачтён', '+' + g + ' XP');
    }
  } else {
    if(minorMistake){
      // typo — no heart loss, no failedWords, but count wrong
      if(!item.isRetry){ P.wrong++; }
      SFX.tap(); haptic('light');
      setFeedback(false, 'Почти!', 'Правильно: ' + correctText, why);
    } else {
      if(!item.isRetry){ P.wrong++; }
      if(ex.w && !P.failedWords.includes(ex.w)) P.failedWords.push(ex.w);
      if(ex.type === 'mc' && ex.w && !P.failedWords.includes(ex.w)) P.failedWords.push(ex.w);

      SFX.wrong(); haptic('error');
      loseHeart();
      updateHeartsUI();
      setFeedback(false, pickOops() + ' Правильный ответ: ' + correctText, '', why);

      // retry queue (max 2 per item)
      if(!item.isRetry && (P.retriesUsed[P.i] || 0) < 2){
        queueRetry(P.i);
      }

      const mod = P.moduleId ? MODULES.find(m => m.id === P.moduleId) : null;
      if(mod && typeof mod.gRef === 'number'){
        const fb = $('#feedback');
        const btn = document.createElement('button');
        btn.className = 'fbLink';
        btn.innerHTML = iconRaw('book') + '<span>Правило</span>';
        btn.onclick = (e) => { e.stopPropagation(); openGrammarFromLesson(mod.gRef); };
        fb.appendChild(btn);
      }

      const body = $('#plBody');
      body.classList.add('shake');
      setTimeout(() => body.classList.remove('shake'), 450);
    }
  }
  updateDots();
}

/* Retry queue: insert clone 4 positions later */
function queueRetry(origPos){
  if((P.retriesUsed[origPos] || 0) >= 2) return;
  const atIndex = Math.min(P.ex.length, P.i + 4);
  if(atIndex <= P.i + 1) return;

  const item = P.ex[origPos];
  if(!item || item.isRetry) return;

  const clone = JSON.parse(JSON.stringify(item.ex));
  const newItem = { ex: clone, isRetry: true, origIdx: item.origIdx, isReview: false };
  P.ex.splice(atIndex, 0, newItem);
  P.results.splice(atIndex, 0, null);
  P.retriesUsed[origPos] = (P.retriesUsed[origPos] || 0) + 1;
}
